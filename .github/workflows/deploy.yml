name: Déployer sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Les données coraniques (public/quran) sont versionnées : les tests les vérifient.
      - run: npm test
      - run: npm run typecheck
      # Polices (604 pages) et audio hébergé ne sont pas versionnés (licences à confirmer) :
      # téléchargés une fois puis mis en cache entre deux déploiements.
      - uses: actions/cache@v6
        with:
          path: |
            public/fonts
            public/audio
          key: media-${{ hashFiles('scripts/import-quran-data/sources.ts', 'scripts/import-quran-data/media.ts') }}
      - run: npm run import:media
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      # Repli SPA : les liens directs (/halaqa/lire/…) chargent l'application.
      - run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
